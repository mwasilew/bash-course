<title>Bash for Beginners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a course binder. Sticky lesson index on the left, one lesson open at a time on the right,
   commands shown as dark terminal panes, keys drawn as keycaps. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --ink: #18232b;
  --muted: #56636c;
  --line: #d8ded9;
  --accent: #1d6676;
  --accent-soft: #e1eef0;
  --key: #9a5a0c;
  --key-bg: #fbf3e6;
  --done: #2f7a46;
  --term-bg: #18212a;
  --term-bar: #222d37;
  --term-fg: #e2e8e3;
  --term-dim: #8fa0a8;
  --term-prompt: #e7a94f;

  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Ubuntu Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --surface: #182027; --ink: #e3e9e5; --muted: #9aa8a2; --line: #2b3640;
    --accent: #72c2d0; --accent-soft: #1b3138; --key: #eab063; --key-bg: #2a2418; --done: #6cc487;
    --term-bg: #0b1014; --term-bar: #151c22; --term-fg: #dde5e0; --term-dim: #7d8c94; --term-prompt: #e7a94f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --surface: #182027; --ink: #e3e9e5; --muted: #9aa8a2; --line: #2b3640;
  --accent: #72c2d0; --accent-soft: #1b3138; --key: #eab063; --key-bg: #2a2418; --done: #6cc487;
  --term-bg: #0b1014; --term-bar: #151c22; --term-fg: #dde5e0; --term-dim: #7d8c94; --term-prompt: #e7a94f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}

.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }

/* ---- sidebar ---- */
.side {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line);
  padding: 28px 18px 40px;
  display: flex; flex-direction: column; gap: 22px;
}
.brand { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.brand span { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.brand span::before { content: "$ "; color: var(--key); }
.side h2 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
  margin: 0 0 6px 10px; font-weight: 700;
}
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.side a {
  display: grid; grid-template-columns: 30px 1fr 18px; align-items: baseline; gap: 6px;
  padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 0.95rem; line-height: 1.35;
}
.side a:hover { background: var(--accent-soft); }
.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.side .num { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.tick::after { content: ""; }
.tick.on::after { content: "✓"; color: var(--done); font-weight: 700; }
.progress { margin: 0 10px; font-size: 0.85rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }

.menu-btn { display: none; }

/* ---- main ---- */
main { padding-inline: 48px; padding-block: 40px 80px; min-width: 0; }
.view { max-width: 780px; }
.eyebrow {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--key);
  font-weight: 700; margin: 0 0 6px;
}
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 4.5vw, 2.9rem); font-weight: 800; margin: 0 0 14px; }
.prose h2 { font-size: 1.6rem; font-weight: 800; margin: 2.4em 0 0.5em; padding-top: 0.6em; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.2rem; font-weight: 600; margin: 1.8em 0 0.4em; }
.prose h4 { font-family: var(--mono); font-size: 0.95rem; font-weight: 600; margin: 1.6em 0 0.4em; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: 0.3em; }
.prose blockquote { margin: 1em 0; padding: 0.2em 1em; border-left: 3px solid var(--line); color: var(--muted); }

.prompt {
  font-family: var(--mono); font-size: 0.9rem; margin: 0;
  background: var(--term-bg); color: var(--term-fg);
  padding: 10px 14px; border-radius: 8px; overflow-x: auto; white-space: nowrap;
}
.ps1 { color: var(--term-prompt); }
.prompt::after { content: "▌"; color: var(--term-fg); animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .prompt::after { animation: none; } .bar i { transition: none; } }

.hero { padding-bottom: 8px; }
.lede { font-size: 1.2rem; color: var(--muted); max-width: 60ch; margin: 0 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; }
.btn {
  display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 700;
  background: var(--accent); color: var(--surface); border: 2px solid var(--accent);
}
.btn.ghost { background: transparent; color: var(--accent); }

/* lesson list on the start page */
.toc { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.toc a {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, auto) 20px; gap: 12px; align-items: baseline;
  padding: 12px 6px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink);
}
.toc a:hover { background: var(--accent-soft); }
.toc .num { font-family: var(--mono); color: var(--key); font-weight: 600; }
.toc .t { font-weight: 700; }
.toc .c { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); text-align: right; }

/* inline code and keycaps */
code { font-family: var(--mono); font-size: 0.86em; }
:not(pre) > code { background: var(--accent-soft); color: var(--ink); padding: 0.1em 0.35em; border-radius: 4px; }
kbd {
  font-family: var(--mono); font-size: 0.8em; font-weight: 600; white-space: nowrap;
  color: var(--key); background: var(--key-bg);
  border: 1px solid var(--key); border-bottom-width: 3px; border-radius: 5px; padding: 0.05em 0.45em;
}

/* terminal panes */
.code { margin: 1em 0 1.3em; border-radius: 10px; overflow: hidden; background: var(--term-bg); }
.code-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--term-bar); color: var(--term-dim);
  font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
  padding: 4px 6px 4px 14px;
}
.copy {
  font: inherit; letter-spacing: 0.06em; color: var(--term-fg); background: transparent;
  border: 1px solid var(--term-dim); border-radius: 5px; padding: 3px 9px; cursor: pointer;
}
.copy:hover { border-color: var(--term-fg); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code pre code { color: var(--term-fg); font-size: 0.88rem; line-height: 1.6; white-space: pre; }

/* tables */
.table { overflow-x: auto; margin: 1em 0 1.4em; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
td:first-child { white-space: nowrap; }

li.task { list-style: none; margin-left: -1.4em; }
li.task input { accent-color: var(--done); margin-right: 6px; }

/* answers */
.answers { margin-top: 3em; border: 1px dashed var(--key); border-radius: 10px; background: var(--surface); }
.answers summary {
  cursor: pointer; padding: 14px 18px; font-weight: 700; color: var(--key); list-style: none;
}
.answers summary::-webkit-details-marker { display: none; }
.answers summary::before { content: "▸ "; }
.answers[open] summary::before { content: "▾ "; }
.answers summary::after { content: " · try the exercises first!"; font-weight: 400; color: var(--muted); }
.answers > .prose { padding: 0 18px 18px; }
.answers .prose > :first-child { margin-top: 0; }

.lesson-foot {
  margin-top: 2.5em; padding-top: 1.4em; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;
}
.done { display: flex; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; }
.done input { width: 20px; height: 20px; accent-color: var(--done); }
.pager { display: flex; gap: 10px; flex-wrap: wrap; }
.pager a {
  text-decoration: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font-size: 0.95rem;
}
.pager a:hover { border-color: var(--accent); color: var(--accent); }
.pager a.next { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }

/* ---- phone ---- */
@media (max-width: 860px) {
  body { font-size: 16px; }
  .shell { display: block; }
  .side {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; max-height: 100vh;
    background: var(--bg); border-right: 0; border-bottom: 1px solid var(--line);
    padding: 12px 16px; gap: 14px;
  }
  .side-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .menu-btn {
    display: inline-block; font: inherit; font-weight: 700; color: var(--accent); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .side .collapsible { display: none; flex-direction: column; gap: 18px; padding-bottom: 8px; }
  .side.open .collapsible { display: flex; }
  .side.open { overflow-y: auto; }
  main { padding-inline: 16px; padding-block: 24px 60px; }
  .toc a { grid-template-columns: 32px minmax(0, 1fr) 18px; }
  .toc .c { display: none; }
  td:first-child { white-space: normal; }
}
</style>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#home"><b>Bash for Beginners</b><span>a course for Ubuntu</span></a>
      <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="side-links">Lessons</button>
    </div>
    <div class="collapsible" id="side-links" style="display:flex">
      <div>
        <h2>Start</h2>
        <ul>
          <li><a href="#home" data-id="home"><span class="num">~</span><span class="t">Start here</span><span></span></a></li>
          <li><a href="#setup" data-id="setup"><span class="num">./</span><span class="t">Set up the practice folder</span><span></span></a></li>
        </ul>
      </div>
      <div>
        <h2>Lessons</h2>
        <ul>{{NAV}}</ul>
      </div>
      <div>
        <h2>Reference</h2>
        <ul><li><a href="#cheatsheet" data-id="cheatsheet"><span class="num">?</span><span class="t">Cheat sheet</span><span></span></a></li></ul>
      </div>
      <div class="progress"><span id="progress-text">0 of 11 done</span><div class="bar"><i id="progress-bar"></i></div></div>
    </div>
  </aside>

  <main id="main">
{{SECTIONS}}
  </main>
</div>

<script>
(function () {
  var side = document.getElementById("side");
  var links = document.getElementById("side-links");
  links.style.display = "";  // let CSS decide (collapsed on phones)
  var menuBtn = document.getElementById("menu-btn");
  menuBtn.addEventListener("click", function () {
    var open = side.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  var views = Array.prototype.slice.call(document.querySelectorAll(".view"));
  var order = views.map(function (v) { return v.id; });
  var lessonIds = order.filter(function (id) { return /^lesson-|^project$/.test(id); });

  // progress, remembered in this browser only
  var KEY = "bash-course-done";
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
  function paintProgress() {
    document.querySelectorAll(".tick").forEach(function (t) { t.classList.toggle("on", !!done[t.dataset.id]); });
    document.querySelectorAll(".done-box").forEach(function (b) { b.checked = !!done[b.dataset.id]; });
    var n = lessonIds.filter(function (id) { return done[id]; }).length;
    document.getElementById("progress-text").textContent = n + " of " + lessonIds.length + " done";
    document.getElementById("progress-bar").style.width = (100 * n / lessonIds.length) + "%";
  }
  document.querySelectorAll(".done-box").forEach(function (b) {
    b.addEventListener("change", function () {
      if (b.checked) done[b.dataset.id] = true; else delete done[b.dataset.id];
      save(); paintProgress();
    });
  });

  // pager links at the bottom of each lesson
  views.forEach(function (v, i) {
    var pager = v.querySelector(".pager");
    if (!pager) return;
    var prev = views[i - 1], next = views[i + 1];
    if (prev) pager.insertAdjacentHTML("beforeend", '<a href="#' + prev.id + '">← ' + prev.dataset.title + '</a>');
    if (next) pager.insertAdjacentHTML("beforeend", '<a class="next" href="#' + next.id + '">' + next.dataset.title + ' →</a>');
  });

  function show() {
    var id = location.hash.replace("#", "");
    if (order.indexOf(id) === -1) id = "home";
    views.forEach(function (v) { v.hidden = v.id !== id; });
    document.querySelectorAll(".side a[data-id]").forEach(function (a) {
      if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    side.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();
  paintProgress();

  // copy buttons on terminal panes
  document.querySelectorAll(".copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var code = btn.closest(".code").querySelector("code");
      var text = code.textContent;
      function flash(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = "Copy"; }, 1500); }
      function selectIt() {
        var r = document.createRange(); r.selectNodeContents(code);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        flash("Selected");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash("Copied"); }, selectIt);
      } else { selectIt(); }
    });
  });
})();
</script>
